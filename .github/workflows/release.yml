name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi bạn push tag (v1.0, v2.0...)
      
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Tự động cài thư viện nếu bạn có file requirements.txt
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE with PyInstaller
        run: |
          # Sử dụng chính xác lệnh bạn đã cung cấp
          pyinstaller --onefile .\main.py --icon icon.ico --name "AoV Image Crawler"

      - name: Delete existing release asset (if any)
        shell: bash
        run: |
          gh release delete-asset "${{ github.ref_name }}" "AoV Image Crawler.exe" --yes 2>/dev/null || true
          echo "Asset cleanup done."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/AoV Image Crawler.exe"
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}