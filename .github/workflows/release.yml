name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi bạn push tag (v1.0, v2.0...)
      
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Tự động cài thư viện nếu bạn có file requirements.txt
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE with PyInstaller
        run: |
          # Sử dụng chính xác lệnh bạn đã cung cấp
          pyinstaller --onefile .\main.py --icon icon.ico --name "AoV Image Crawler"

      - name: Delete existing release asset (if any)
        run: |
          $tag = "${{ github.ref_name }}"
          $assetName = "AoV Image Crawler.exe"
          $release = gh release view $tag --json assets --jq ".assets[] | select(.name == \"$assetName\") | .id" 2>$null
          if ($release) {
            Write-Host "Deleting old asset: $assetName (id=$release)"
            gh release delete-asset $tag $assetName --yes
          } else {
            Write-Host "No existing asset found, skipping delete."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          # Đường dẫn file sau khi build xong (nằm trong folder dist)
          files: "dist/AoV Image Crawler.exe"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
